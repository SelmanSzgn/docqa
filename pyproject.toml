[project]
name = "docqa"
version = "0.1.0"
description = "RAG project"
readme = "README.md"
authors = [
    { name = "SelmanSzgn", email = "selman.szg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "chromadb>=1.5.9",
    "fastapi>=0.143.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
docqa = "docqa:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length=79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

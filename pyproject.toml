[project]
name = "docqa"
version = "0.1.0"
description = "RAG project"
readme = "README.md"
authors = [
    { name = "SelmanSzgn", email = "selman.szg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
docqa = "docqa:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
